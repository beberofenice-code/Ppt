  <g id="explanation" data-pptx-bounds="100 254 1108 186">
    <text font-size="30" fill="#1E2A36" x="100" y="292">People express spirituality in <tspan font-weight="bold" fill="#1F3A5F">many ways.</tspan> Some follow organized</text><text font-size="30" fill="#1E2A36" x="100" y="336">religions such as Christianity, Islam, Buddhism, or Hinduism, while</text><text font-size="30" fill="#1E2A36" x="100" y="380">others are spiritual without belonging to any religion. Each perspective</text><text font-size="30" fill="#1E2A36" x="100" y="424">offers its own way of understanding life and the sacred.</text></g>

  <g id="explanation" data-pptx-bounds="100 254 1108 150">
    <text font-size="30" fill="#1E2A36" x="100" y="292">People hold many different beliefs, and <tspan font-weight="bold" fill="#1F3A5F">each deserves respect.</tspan> Being</text><text font-size="30" fill="#1E2A36" x="100" y="336">open-minded and tolerant helps prevent conflict, encourages understanding</text><text font-size="30" fill="#1E2A36" x="100" y="380">between cultures, and allows everyone to live together peacefully.</text></g>

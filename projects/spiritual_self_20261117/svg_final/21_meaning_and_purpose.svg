  <g id="explanation" data-pptx-bounds="100 254 1108 150">
    <text font-size="30" fill="#1E2A36" x="100" y="292">Ultimately, spirituality helps people discover <tspan font-weight="bold" fill="#1F3A5F">why their lives matter.</tspan></text><text font-size="30" fill="#1E2A36" x="100" y="336">A clear sense of meaning and purpose gives direction to goals, motivates</text><text font-size="30" fill="#1E2A36" x="100" y="380">people through hardship, and brings a deeper sense of fulfillment.</text></g>

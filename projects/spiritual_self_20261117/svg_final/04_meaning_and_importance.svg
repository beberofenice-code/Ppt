    <text font-size="52" font-weight="bold" fill="#1F3A5F" font-family="Georgia, serif" x="100" y="144">Meaning and Importance of</text><text font-size="52" font-weight="bold" fill="#1F3A5F" font-family="Georgia, serif" x="100" y="208">Spirituality in Human Life</text></g>
  <g id="explanation" data-pptx-bounds="100 262 720 330">
    <text font-size="30" fill="#1E2A36" x="100" y="304">Spirituality gives people a sense of</text><text font-size="30" fill="#1E2A36" x="100" y="348"><tspan><tspan font-weight="bold" fill="#1F3A5F">direction and belonging.</tspan> It helps them</tspan></text><text font-size="30" fill="#1E2A36" x="100" y="392">make sense of life's experiences, cope</text><text font-size="30" fill="#1E2A36" x="100" y="436">with difficulties, and feel that their lives</text><text font-size="30" fill="#1E2A36" x="100" y="480">matter. For many people, it is an</text><text font-size="30" fill="#1E2A36" x="100" y="524"><tspan>important source of <tspan font-weight="bold" fill="#1F3A5F">comfort,</tspan> identity,</tspan></text><text font-size="30" fill="#1E2A36" x="100" y="568">and motivation.</text></g>

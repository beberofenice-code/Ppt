  <g id="explanation" data-pptx-bounds="100 254 1108 150">
    <text font-size="30" fill="#1E2A36" x="100" y="292">Faith and strong values act like <tspan font-weight="bold" fill="#1F3A5F">an anchor.</tspan> They give people stability</text><text font-size="30" fill="#1E2A36" x="100" y="336">when life is uncertain, help them stay consistent in their choices, and</text><text font-size="30" fill="#1E2A36" x="100" y="380">guide them to act with integrity even when it is difficult.</text></g>

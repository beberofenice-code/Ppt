  <g id="explanation" data-pptx-bounds="100 190 1108 186">
    <text font-size="30" fill="#1E2A36" x="100" y="230">Gathering with others in places of worship or spiritual communities —</text><text font-size="30" fill="#1E2A36" x="100" y="274"><tspan>such as churches, mosques, or temples — <tspan font-weight="bold" fill="#1F3A5F">strengthens faith</tspan> and creates</tspan></text><text font-size="30" fill="#1E2A36" x="100" y="318"><tspan>a <tspan font-weight="bold" fill="#1F3A5F">sense of belonging.</tspan> Shared rituals and celebrations remind people</tspan></text><text font-size="30" fill="#1E2A36" x="100" y="362">that they are not alone.</text></g>

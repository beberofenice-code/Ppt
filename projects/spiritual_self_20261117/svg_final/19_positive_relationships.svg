  <g id="explanation" data-pptx-bounds="100 254 640 290">
    <text font-size="30" fill="#1E2A36" x="100" y="292">Many spiritual teachings emphasize</text><text font-size="30" fill="#1E2A36" x="100" y="336"><tspan><tspan font-weight="bold" fill="#1F3A5F">love, compassion, and respect</tspan> for</tspan></text><text font-size="30" fill="#1E2A36" x="100" y="380">others. Practicing these values helps</text><text font-size="30" fill="#1E2A36" x="100" y="424">people build healthy, supportive</text><text font-size="30" fill="#1E2A36" x="100" y="468">relationships with family, friends,</text><text font-size="30" fill="#1E2A36" x="100" y="512">and the wider community.</text></g>

    <text x="100" y="144" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#1F3A5F">Definition of the Spiritual Self</text>
  </g>
  <g id="explanation" data-pptx-bounds="100 200 1108 190">
    <text font-size="30" fill="#1E2A36" x="100" y="240">The spiritual self is the part of a person that seeks <tspan font-weight="bold" fill="#1F3A5F">meaning,</tspan></text><text font-size="30" fill="#1E2A36" x="100" y="284"><tspan><tspan font-weight="bold" fill="#1F3A5F">purpose, and connection</tspan> with something greater than oneself —</tspan></text><text font-size="30" fill="#1E2A36" x="100" y="328">such as God, a higher power, nature, or humanity. It is expressed</text><text font-size="30" fill="#1E2A36" x="100" y="372">through a person's beliefs, values, and inner sense of who they are.</text></g>

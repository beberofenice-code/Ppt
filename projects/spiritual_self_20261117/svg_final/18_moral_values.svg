  <g id="explanation" data-pptx-bounds="100 190 1108 142">
    <text font-size="30" fill="#1E2A36" x="100" y="230">Spirituality encourages values such as honesty, respect, responsibility,</text><text font-size="30" fill="#1E2A36" x="100" y="274"><tspan>and fairness. These moral values help people <tspan font-weight="bold" fill="#1F3A5F">tell right from wrong</tspan> and</tspan></text><text font-size="30" fill="#1E2A36" x="100" y="318">become trustworthy members of their families and communities.</text></g>

  <g id="explanation" data-pptx-bounds="100 254 1108 186">
    <text font-size="30" fill="#1E2A36" x="100" y="292">Spiritual beliefs are not only ideas; they show in daily actions. People</text><text font-size="30" fill="#1E2A36" x="100" y="336">who value compassion may volunteer or help their neighbors, and those</text><text font-size="30" fill="#1E2A36" x="100" y="380"><tspan>who value honesty try to be truthful. <tspan font-weight="bold" fill="#1F3A5F">Behavior becomes the outward</tspan></tspan></text><text font-size="30" fill="#1E2A36" x="100" y="424"><tspan><tspan font-weight="bold" fill="#1F3A5F">expression of inner beliefs.</tspan></tspan></text></g>

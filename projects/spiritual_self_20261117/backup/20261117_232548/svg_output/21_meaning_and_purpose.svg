  </g>
  <g id="explanation" data-pptx-bounds="100 254 1108 150">
    <text x="100" y="292" font-size="30" fill="#1E2A36">Ultimately, spirituality helps people discover <tspan font-weight="bold" fill="#1F3A5F">why their lives matter.</tspan><tspan x="100" dy="44">A clear sense of meaning and purpose gives direction to goals, motivates</tspan><tspan x="100" dy="44">people through hardship, and brings a deeper sense of fulfillment.</tspan></text>
  </g>

  <g id="explanation" data-pptx-bounds="100 190 1108 186">
    <text x="100" y="230" font-size="30" fill="#1E2A36">Gathering with others in places of worship or spiritual communities —<tspan x="100" dy="44">such as churches, mosques, or temples — <tspan font-weight="bold" fill="#1F3A5F">strengthens faith</tspan> and creates</tspan><tspan x="100" dy="44">a <tspan font-weight="bold" fill="#1F3A5F">sense of belonging.</tspan> Shared rituals and celebrations remind people</tspan><tspan x="100" dy="44">that they are not alone.</tspan></text>
  </g>

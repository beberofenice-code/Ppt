    <text x="100" y="144" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#1F3A5F">Learning Patience, Acceptance,<tspan x="100" dy="64">and Understanding</tspan></text>
  </g>
  <g id="explanation" data-pptx-bounds="100 254 1108 150">
    <text x="100" y="292" font-size="30" fill="#1E2A36">Spiritual growth teaches people three important qualities. Together,<tspan x="100" dy="44">these qualities make people <tspan font-weight="bold" fill="#1F3A5F">more mature and resilient</tspan> when facing</tspan><tspan x="100" dy="44">everyday challenges and relationships.</tspan></text>
  </g>
  <g id="quality-patience" data-pptx-bounds="100 430 348 200">
    <rect x="100" y="432" width="348" height="196" rx="14" fill="#FFFFFF" stroke="#D5DEE6" stroke-width="2"/>
    <rect x="100" y="432" width="8" height="196" fill="#2A9D8F"/>
    <use data-icon="tabler-filled/seedling" x="132" y="452" width="44" height="44" fill="#2A9D8F"/>
    <text x="132" y="534" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#1F3A5F">Patience</text>
    <text x="132" y="578" font-size="30" fill="#1E2A36">waiting calmly</text>
  </g>
  <g id="quality-acceptance" data-pptx-bounds="480 430 348 200">
    <rect x="480" y="432" width="348" height="196" rx="14" fill="#FFFFFF" stroke="#D5DEE6" stroke-width="2"/>
    <rect x="480" y="432" width="8" height="196" fill="#2A9D8F"/>
    <use data-icon="tabler-filled/leaf" x="512" y="452" width="44" height="44" fill="#2A9D8F"/>
    <text x="512" y="534" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#1F3A5F">Acceptance</text>
    <text x="512" y="578" font-size="30" fill="#1E2A36">embracing what<tspan x="512" dy="38">cannot change</tspan></text>
  </g>
  <g id="quality-understanding" data-pptx-bounds="860 430 348 200">
    <rect x="860" y="432" width="348" height="196" rx="14" fill="#FFFFFF" stroke="#D5DEE6" stroke-width="2"/>
    <rect x="860" y="432" width="8" height="196" fill="#2A9D8F"/>
    <use data-icon="tabler-filled/eye" x="892" y="452" width="44" height="44" fill="#2A9D8F"/>
    <text x="892" y="534" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#1F3A5F">Understanding</text>
    <text x="892" y="578" font-size="30" fill="#1E2A36">seeing others'<tspan x="892" dy="38">points of view</tspan></text>

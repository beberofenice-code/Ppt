    <line x1="430" y1="526" x2="470" y2="526" stroke="#2A9D8F" stroke-width="4" marker-end="url(#arrowHead)"/>
    <line x1="810" y1="526" x2="850" y2="526" stroke="#2A9D8F" stroke-width="4" marker-end="url(#arrowHead)"/>
    <g id="step-tolerance">
      <rect x="100" y="456" width="330" height="140" rx="14" fill="#EEF4F6"/>

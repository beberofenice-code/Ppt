    <text x="100" y="144" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#1F3A5F">Respecting Different Beliefs and<tspan x="100" dy="64">Religions</tspan></text>
  </g>
  <g id="explanation" data-pptx-bounds="100 254 1108 150">
    <text x="100" y="292" font-size="30" fill="#1E2A36">People hold many different beliefs, and <tspan font-weight="bold" fill="#1F3A5F">each deserves respect.</tspan> Being<tspan x="100" dy="44">open-minded and tolerant helps prevent conflict, encourages understanding</tspan><tspan x="100" dy="44">between cultures, and allows everyone to live together peacefully.</tspan></text>
  </g>

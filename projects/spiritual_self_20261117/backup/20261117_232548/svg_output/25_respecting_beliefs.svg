      <use data-icon="tabler-filled/bulb" x="621" y="472" width="48" height="48" fill="#2A9D8F"/>
      <text x="645" y="568" font-size="30" font-weight="bold" fill="#1F3A5F" text-anchor="middle">Open-mindedness</text>
    </g>
    <g id="step-peace">

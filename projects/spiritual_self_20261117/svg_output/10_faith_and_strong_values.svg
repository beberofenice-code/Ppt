    <text x="100" y="144" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#1F3A5F">The Importance of Having Faith<tspan x="100" dy="64">and Strong Values</tspan></text>
  </g>
  <g id="explanation" data-pptx-bounds="100 254 1108 150">
    <text x="100" y="292" font-size="30" fill="#1E2A36">Faith and strong values act like <tspan font-weight="bold" fill="#1F3A5F">an anchor.</tspan> They give people stability<tspan x="100" dy="44">when life is uncertain, help them stay consistent in their choices, and</tspan><tspan x="100" dy="44">guide them to act with integrity even when it is difficult.</tspan></text>
  </g>

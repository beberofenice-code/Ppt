    <text x="100" y="144" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#1F3A5F">How Spiritual Beliefs Influence<tspan x="100" dy="64">Actions and Behavior</tspan></text>
  </g>
  <g id="explanation" data-pptx-bounds="100 254 1108 186">
    <text x="100" y="292" font-size="30" fill="#1E2A36">Spiritual beliefs are not only ideas; they show in daily actions. People<tspan x="100" dy="44">who value compassion may volunteer or help their neighbors, and those</tspan><tspan x="100" dy="44">who value honesty try to be truthful. <tspan font-weight="bold" fill="#1F3A5F">Behavior becomes the outward</tspan></tspan><tspan x="100" dy="44"><tspan font-weight="bold" fill="#1F3A5F">expression of inner beliefs.</tspan></tspan></text>
  </g>
  <g id="belief-compassion" data-pptx-bounds="100 470 308 80">

  <g id="explanation" data-pptx-bounds="100 254 1108 186">
    <text x="100" y="292" font-size="30" fill="#1E2A36">People express spirituality in <tspan font-weight="bold" fill="#1F3A5F">many ways.</tspan> Some follow organized<tspan x="100" dy="44">religions such as Christianity, Islam, Buddhism, or Hinduism, while</tspan><tspan x="100" dy="44">others are spiritual without belonging to any religion. Each perspective</tspan><tspan x="100" dy="44">offers its own way of understanding life and the sacred.</tspan></text>
  </g>

    <text x="100" y="144" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#1F3A5F">How Faith Provides Hope, Peace,<tspan x="100" dy="64">and Strength</tspan></text>
  </g>
  <g id="explanation" data-pptx-bounds="100 254 1108 150">
    <text x="100" y="292" font-size="30" fill="#1E2A36">In difficult times — such as illness, loss, or failure — faith can give<tspan x="100" dy="44">people hope that things will improve, inner peace to accept what they</tspan><tspan x="100" dy="44">cannot change, and the strength to continue.</tspan></text>
  </g>
  <g id="gift-hope" data-pptx-bounds="100 432 348 190">
    <rect x="100" y="436" width="348" height="6" fill="#2A9D8F"/>
    <use data-icon="tabler-filled/sunrise" x="100" y="466" width="52" height="52" fill="#C9A227"/>
    <text x="168" y="506" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#1F3A5F">Hope</text>
    <text x="100" y="568" font-size="26" fill="#1E2A36">a belief that things<tspan x="100" dy="36">can get better</tspan></text>
  </g>
  <g id="gift-peace" data-pptx-bounds="480 432 348 190">
    <rect x="480" y="436" width="348" height="6" fill="#2A9D8F"/>
    <use data-icon="tabler-filled/moon" x="480" y="466" width="52" height="52" fill="#C9A227"/>
    <text x="548" y="506" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#1F3A5F">Peace</text>
    <text x="480" y="568" font-size="26" fill="#1E2A36">accepting what<tspan x="480" dy="36">cannot be changed</tspan></text>
  </g>
  <g id="gift-strength" data-pptx-bounds="860 432 348 190">
    <rect x="860" y="436" width="348" height="6" fill="#2A9D8F"/>
    <use data-icon="tabler-filled/flame" x="860" y="466" width="52" height="52" fill="#C9A227"/>

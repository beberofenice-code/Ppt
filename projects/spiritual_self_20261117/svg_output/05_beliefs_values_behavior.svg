    <text x="100" y="144" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#1F3A5F">How Spirituality Influences Beliefs,<tspan x="100" dy="64">Values, and Behavior</tspan></text>
  </g>
  <g id="explanation" data-pptx-bounds="100 254 1108 186">
    <text x="100" y="292" font-size="30" fill="#1E2A36">Spiritual beliefs shape what people consider right, good, and important.<tspan x="100" dy="44">These values then guide everyday behavior — how people treat others,</tspan><tspan x="100" dy="44">make choices, and respond to challenges. In this way, <tspan font-weight="bold" fill="#1F3A5F">inner belief</tspan></tspan><tspan x="100" dy="44"><tspan font-weight="bold" fill="#1F3A5F">becomes visible through outward action.</tspan></tspan></text>
  </g>

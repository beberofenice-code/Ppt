    <text x="100" y="144" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#1F3A5F">Meaning and Importance of<tspan x="100" dy="64">Spirituality in Human Life</tspan></text>
  </g>
  <g id="explanation" data-pptx-bounds="100 262 720 330">
    <text x="100" y="304" font-size="30" fill="#1E2A36">Spirituality gives people a sense of<tspan x="100" dy="44"><tspan font-weight="bold" fill="#1F3A5F">direction and belonging.</tspan> It helps them</tspan><tspan x="100" dy="44">make sense of life's experiences, cope</tspan><tspan x="100" dy="44">with difficulties, and feel that their lives</tspan><tspan x="100" dy="44">matter. For many people, it is an</tspan><tspan x="100" dy="44">important source of <tspan font-weight="bold" fill="#1F3A5F">comfort,</tspan> identity,</tspan><tspan x="100" dy="44">and motivation.</tspan></text>
  </g>

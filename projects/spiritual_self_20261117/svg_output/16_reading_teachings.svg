<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, sans-serif" data-pptx-page-role="content">
  <defs>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#2A9D8F"/>
    </marker>
  </defs>
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="section-label" data-pptx-role="header" data-pptx-bounds="72 40 700 36">
    <circle cx="78" cy="57" r="6" fill="#C9A227"/>
    <text x="94" y="64" font-size="20" font-weight="bold" fill="#4A5A6A">II-C · SPIRITUAL PRACTICES</text>
  </g>
  <g id="title" data-pptx-bounds="72 92 1136 140">
    <rect x="72" y="100" width="8" height="118" fill="#2A9D8F"/>
    <text x="100" y="144" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#1F3A5F">Reading Spiritual or Religious<tspan x="100" dy="64">Teachings</tspan></text>
  </g>
  <g id="explanation" data-pptx-bounds="100 254 1108 186">
    <text x="100" y="292" font-size="30" fill="#1E2A36">Sacred texts and spiritual writings, such as the Bible, the Qur'an, or other<tspan x="100" dy="44">teachings, offer <tspan font-weight="bold" fill="#1F3A5F">lessons on how to live well.</tspan> Reading and reflecting on</tspan><tspan x="100" dy="44">them helps people understand their beliefs more deeply and apply</tspan><tspan x="100" dy="44">them to daily life.</tspan></text>
  </g>
  <g id="study-steps" data-pptx-bounds="100 464 1108 176">
    <line x1="290" y1="512" x2="566" y2="512" stroke="#2A9D8F" stroke-width="4" marker-end="url(#arrowHead)"/>
    <line x1="714" y1="512" x2="990" y2="512" stroke="#2A9D8F" stroke-width="4" marker-end="url(#arrowHead)"/>
    <g id="step-read">
      <circle cx="230" cy="512" r="44" fill="#1F3A5F"/>
      <use data-icon="tabler-filled/book" x="206" y="488" width="48" height="48" fill="#FFFFFF"/>
      <text x="230" y="600" font-size="30" font-weight="bold" fill="#1F3A5F" text-anchor="middle">Read</text>
      <text x="230" y="632" font-size="24" fill="#4A5A6A" text-anchor="middle">learn the teachings</text>
    </g>
    <g id="step-reflect">
      <circle cx="640" cy="512" r="44" fill="#2A9D8F"/>
      <use data-icon="tabler-filled/bulb" x="616" y="488" width="48" height="48" fill="#FFFFFF"/>
      <text x="640" y="600" font-size="30" font-weight="bold" fill="#1F3A5F" text-anchor="middle">Reflect</text>
      <text x="640" y="632" font-size="24" fill="#4A5A6A" text-anchor="middle">understand more deeply</text>
    </g>
    <g id="step-apply">
      <circle cx="1050" cy="512" r="44" fill="#1F3A5F"/>
      <use data-icon="tabler-filled/star" x="1026" y="488" width="48" height="48" fill="#FFFFFF"/>
      <text x="1050" y="600" font-size="30" font-weight="bold" fill="#1F3A5F" text-anchor="middle">Apply</text>
      <text x="1050" y="632" font-size="24" fill="#4A5A6A" text-anchor="middle">live it every day</text>
    </g>
  </g>
  <g id="page-number" data-pptx-role="page-number" data-pptx-bounds="1100 656 108 36">
    <text x="1208" y="684" font-size="20" fill="#4A5A6A" text-anchor="end">16</text>
  </g>
</svg>
